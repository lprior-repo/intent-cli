[package]
name = "intent-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core functionality for Intent CLI - zero unwrap, idiomatic Rust"

[lib]
name = "intent_core"
path = "src/lib.rs"

[dependencies]
# Beads-rust from Emmanuel (for issue tracking integration)
# TODO: Enable when rust-version 1.85+ is available
# beads_rust = { git = "https://github.com/Dicklesworthstone/beads_rust" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Templating
askama = "0.12"

# Immutable data structures
im = { version = "15.1", features = ["serde"] }

# Functional utils
tap = "1.0"
strum = { version = "0.26", features = ["derive"] }
itertools = "0.13"
either = "1.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# System
directories = "6"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Text processing
regex = "1.11"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
tempfile = "3.0"

[lints]
workspace = true
