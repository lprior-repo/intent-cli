# Project configuration for intent-cli
# https://moonrepo.dev/docs/config/project

$schema: 'https://moonrepo.dev/schemas/project.json'

# Project metadata
type: 'application'
language: 'unknown'  # Gleam not natively supported yet

# Task definitions following moon best practices
tasks:
  # ============================================
  # Code Quality - Format Checking
  # ============================================

  format:
    command: 'mise exec -- gleam format'
    inputs:
      - 'src/**/*.gleam'
      - 'test/**/*.gleam'
      - 'src/**/*.erl'
    options:
      runInCI: false  # Only run format-check in CI
      cache: false  # Fast operation, no need to cache

  format-check:
    command: 'mise exec -- gleam format --check'
    inputs:
      - 'src/**/*.gleam'
      - 'test/**/*.gleam'
      - 'src/**/*.erl'
    options:
      runInCI: true
      cache: true
      outputStyle: 'stream'

  # ============================================
  # Build Pipeline
  # ============================================

  build:
    command: 'mise exec -- gleam build --target erlang'
    deps:
      - '~:format-check'
    inputs:
      - 'src/**/*.gleam'
      - 'src/**/*.erl'
      - 'gleam.toml'
      - 'manifest.toml'
    outputs:
      - 'build/dev/erlang/**/*'
    options:
      runInCI: true
      cache: true
      outputStyle: 'stream'

  clean:
    command:
      - 'rm'
      - '-rf'
      - 'build'
      - 'dist'
    options:
      runInCI: false
      cache: false

  # ============================================
  # Testing Pipeline
  # ============================================

  test:
    command: 'mise exec -- gleam test'
    deps:
      - '~:build'
    inputs:
      - 'test/**/*.gleam'
      - 'src/**/*.gleam'
      - 'gleam.toml'
    options:
      runInCI: true
      retryCount: 2  # Retry flaky tests
      cache: true
      outputStyle: 'stream'

  # ============================================
  # Complete CI Pipeline
  # ============================================

  ci:
    deps:
      - '~:format-check'
      - '~:build'
      - '~:test'
    options:
      runInCI: true
      cache: false  # Don't cache orchestration tasks

  # ============================================
  # Single Binary Build (Escript)
  # ============================================

  escript:
    command: 'mise exec -- gleam run -m gleescript -- --out dist/intent'
    deps:
      - '~:test'  # Only build binary after tests pass
    inputs:
      - 'src/**/*.gleam'
      - 'src/**/*.erl'
      - 'gleam.toml'
    outputs:
      - 'dist/intent/**/*'
    options:
      runInCI: true
      cache: true
      cacheLifetime: '7 days'  # Cache binaries for a week

  # ============================================
  # Install to System PATH
  # ============================================

  install:
    command:
      - 'bash'
      - '-c'
      - |
        mkdir -p ~/.local/bin ~/.local/share/intent
        cp dist/intent/intent ~/.local/bin/intent
        chmod +x ~/.local/bin/intent
        cp -r schema ~/.local/share/intent/
        cp -r cue.mod ~/.local/share/intent/
    deps:
      - '~:escript'  # Build binary first
    inputs:
      - 'dist/intent/intent'
      - 'schema/**/*.cue'
      - 'cue.mod/**/*'
    options:
      runInCI: false
      cache: false  # Always copy to ensure latest version

  # ============================================
  # Local Development
  # ============================================

  dev:
    command: 'mise exec -- gleam run'
    deps:
      - '~:build'
    options:
      persistent: true  # Long-running task
      runInCI: false
      cache: false
