# Project configuration for intent-cli
# https://moonrepo.dev/docs/config/project

$schema: 'https://moonrepo.dev/schemas/project.json'

# Project metadata
type: 'application'
language: 'unknown'  # Gleam not natively supported yet

# Task definitions following moon best practices
tasks:
  # ============================================
  # Code Quality - Format Checking
  # ============================================

  format:
    command: 'gleam format'
    inputs:
      - 'src/**/*.gleam'
      - 'test/**/*.gleam'
      - 'src/**/*.erl'
    options:
      runInCI: false  # Only run format-check in CI
      cache: false  # Fast operation, no need to cache

  format-check:
    command: 'gleam format --check'
    inputs:
      - 'src/**/*.gleam'
      - 'test/**/*.gleam'
      - 'src/**/*.erl'
    options:
      runInCI: true
      cache: true
      outputStyle: 'stream'

  # ============================================
  # Build Pipeline
  # ============================================

  build:
    command: 'gleam build --target erlang'
    deps:
      - '~:format-check'
    inputs:
      - 'src/**/*.gleam'
      - 'src/**/*.erl'
      - 'gleam.toml'
      - 'manifest.toml'
    outputs:
      - 'build/dev/erlang/**/*'
    options:
      runInCI: true
      cache: true
      outputStyle: 'stream'

  clean:
    command:
      - 'rm'
      - '-rf'
      - 'build'
      - 'dist'
    options:
      runInCI: false
      cache: false

  # ============================================
  # Testing Pipeline
  # ============================================

  test:
    command: 'gleam test'
    deps:
      - '~:build'
    inputs:
      - 'test/**/*.gleam'
      - 'src/**/*.gleam'
      - 'gleam.toml'
    options:
      runInCI: true
      retryCount: 2  # Retry flaky tests
      cache: true
      outputStyle: 'stream'

  # ============================================
  # Complete CI Pipeline
  # ============================================

  ci:
    deps:
      - '~:format-check'
      - '~:build'
      - '~:test'
    options:
      runInCI: true
      cache: false  # Don't cache orchestration tasks

  # ============================================
  # Single Binary Build (Escript)
  # ============================================

  escript:
    command: 'gleam run -m gleescript -- --out dist/intent'
    deps:
      - '~:test'  # Only build binary after tests pass
    inputs:
      - 'src/**/*.gleam'
      - 'src/**/*.erl'
      - 'gleam.toml'
    outputs:
      - 'dist/intent/**/*'
    options:
      runInCI: true
      cache: true
      cacheLifetime: '7 days'  # Cache binaries for a week

  # ============================================
  # Local Development
  # ============================================

  dev:
    command: 'gleam run'
    deps:
      - '~:build'
    options:
      persistent: true  # Long-running task
      runInCI: false
      cache: false
